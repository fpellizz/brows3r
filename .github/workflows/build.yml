name: Build

# Triggered by Bitbucket mirroring `main` and `v*` tags to this repo.
#
# - push to main: build all platforms, expose bundles as workflow
#   artifacts (sanity check; nothing is published).
# - push of a v* tag: build all platforms, sign updater artifacts and
#   create / append to a GitHub release containing the bundles, the
#   `.sig` files and a `latest.json` manifest consumed by the in-app
#   auto-updater (see `src-tauri/tauri.conf.json` → plugins.updater.endpoints).
#
# Required GitHub repository secrets:
#   - TAURI_SIGNING_PRIVATE_KEY           (full content of brows3r-updater.key)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (the passphrase used when generating the key)
# `GITHUB_TOKEN` is provided automatically by GitHub Actions; it's what
# tauri-action uses to create the release.

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    strategy:
      # Don't abort the Windows build if Linux fails (and vice-versa) —
      # one platform's bundle is still useful on its own.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            artifact-name: linux-bundles
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - platform: windows-latest
            artifact-name: windows-bundles
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # needed to create the release on tag pushes

    steps:
      - uses: actions/checkout@v4

      # Linux needs the WebKitGTK + GTK + soup dev headers, plus `file`
      # and `rpm` for the bundler to produce .deb / .rpm. Windows has
      # no extra system dependencies — Tauri downloads NSIS itself on
      # first build, and the WebView2 runtime is already on the runner.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file pkg-config rpm \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The official Tauri action handles `cargo install tauri-cli`,
      # runs `pnpm tauri build`, and — when `tagName` is set — creates
      # or updates a GitHub release with all bundles. With
      # `includeUpdaterJson: true` plus `createUpdaterArtifacts: true`
      # in tauri.conf.json, it also generates and uploads the signed
      # `latest.json` consumed by tauri-plugin-updater. When the second
      # matrix job runs against the same tag, the action appends to the
      # existing release and merges its platform entry into latest.json.
      - name: Tauri build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('brows3r {0}', github.ref_name) || '' }}
          releaseBody: "See the commit history for changes in this release."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # On non-tag builds, expose the bundles as workflow artifacts so
      # we can sanity-check them without publishing anything. Each
      # matrix leg uploads to a different artifact name so they don't
      # overwrite each other.
      - name: Upload bundles (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn
          retention-days: 14
