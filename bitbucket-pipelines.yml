image: ubuntu:24.04

definitions:
  caches:
    cargo:
      key:
        files:
          - src-tauri/Cargo.lock
      path: /root/.cargo/registry
    cargo-target:
      key:
        files:
          - src-tauri/Cargo.lock
      path: src-tauri/target
    pnpm:
      key:
        files:
          - pnpm-lock.yaml
      path: .pnpm-store

# Bitbucket runs only lint + unit tests. The actual Linux bundling
# (.deb / .rpm / .AppImage + updater signing + GitHub release) happens
# on GitHub Actions, because Bitbucket's pipeline container has no
# /dev/fuse access and the Tauri AppImage bundler (linuxdeploy) cannot
# run there. See `.github/workflows/build-linux.yml` on the mirror.
pipelines:
  default:
    - step:
        name: "Frontend: lint + typecheck + test"
        caches:
          - pnpm
          - node
        script:
          # ubuntu:24.04 minimale non ha curl/ca-certificates preinstallati;
          # serve installarli prima del setup script di NodeSource.
          - apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y nodejs
          - corepack enable
          - corepack prepare pnpm@latest --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm lint
          - pnpm typecheck
          - pnpm test

    - step:
        name: "Backend: fmt + clippy + test"
        size: 2x
        caches:
          - cargo
          - cargo-target
        script:
          - apt-get update && apt-get install -y
              build-essential curl pkg-config
              libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
              libayatana-appindicator3-dev librsvg2-dev
              libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy,rustfmt
          - source $HOME/.cargo/env
          - cd src-tauri && cargo fmt --all -- --check
          # `tauri::generate_context!` (proc macro) reads
          # `frontendDist: "../dist"` from tauri.conf.json and panics
          # at compile time if the path does not exist. The Backend
          # step does not build the frontend, so we lay down a minimal
          # placeholder dir just so the macro can include something.
          - mkdir -p ../dist && touch ../dist/index.html
          - cargo clippy -- -D clippy::correctness -D clippy::suspicious
          - cargo test

  pull-requests:
    "**":
      - step:
          name: "Frontend: lint + typecheck + test"
          caches:
            - pnpm
            - node
          script:
            - apt-get update -qq && apt-get install -y -qq curl ca-certificates
            - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            - apt-get install -y nodejs
            - corepack enable
            - corepack prepare pnpm@latest --activate
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
            - pnpm lint
            - pnpm typecheck
            - pnpm test

      - step:
          name: "Backend: fmt + clippy + test"
          size: 2x
          caches:
            - cargo
            - cargo-target
          script:
            - apt-get update && apt-get install -y
                build-essential curl pkg-config
                libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev
                libayatana-appindicator3-dev librsvg2-dev
                libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
            - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy,rustfmt
            - source $HOME/.cargo/env
            - cd src-tauri && cargo fmt --all -- --check
            - mkdir -p ../dist && touch ../dist/index.html
            - cargo clippy -- -D clippy::correctness -D clippy::suspicious
            - cargo test
