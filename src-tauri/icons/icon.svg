<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bucket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#glow)"/>

  <!-- S3 Bucket shape — tapered cylinder -->
  <path d="M144 160 C144 140, 368 140, 368 160 L348 360 C348 380, 164 380, 164 360 Z"
        fill="url(#bucket)" stroke="white" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Bucket top ellipse -->
  <ellipse cx="256" cy="160" rx="112" ry="22"
           fill="white" fill-opacity="0.25" stroke="white" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bucket band -->
  <path d="M154 230 C154 222, 358 222, 358 230 C358 238, 154 238, 154 230"
        fill="white" fill-opacity="0.15"/>

  <!-- "3" stylized inside the bucket — the S3 reference -->
  <text x="256" y="320" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="120"
        fill="white" fill-opacity="0.85" letter-spacing="-4">
    3
  </text>

  <!-- Browse arrows / magnifying glass hint — small at bottom right -->
  <g transform="translate(340, 350)">
    <circle cx="28" cy="28" r="26" fill="none" stroke="white" stroke-width="7" stroke-opacity="0.9"/>
    <line x1="48" y1="48" x2="72" y2="72" stroke="white" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9"/>
  </g>
</svg>
